name: nightcore-auth-service

networks:
  nightcore-network:
    name: nightcore-network
    driver: bridge
    external: true

services:
  nightcore-auth-service:
    image: nightcore-auth-service:latest
    container_name: nightcore-auth-service
    build:
      context: .
      dockerfile: Dockerfile
    restart: no
    env_file:
      - .env

    volumes:
      - ./src/:/app/src/
      - ./main.py:/app/main.py

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-auth-service.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.dashboard-auth-service.priority=20"
      - "traefik.http.routers.dashboard-auth-service.entrypoints=web"
      - "traefik.http.routers.dashboard-auth-service.service=dashboard-auth-service"
      - "traefik.http.services.dashboard-auth-service.loadbalancer.server.port=${API_PORT}"
      - "traefik.http.routers.dashboard-auth-service.tls=false"

    networks:
      - nightcore-network